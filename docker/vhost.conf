# Конфиг nginx перед php-fpm приложения. Повторяет _docker/vhost.conf
# исходного проекта: свой нужен потому, что опубликованный образ
# testsmith/practice-software-testing-web собран только под arm64
# и на amd64-раннерах падает с «exec format error».
server {
    listen 80;
    index index.php index.html;
    server_name toolshop.local;
    root /var/www/public;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    # Поток событий: отдаём без буферизации, иначе события копятся до конца ответа
    location = /sales-stream {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        gzip off;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
