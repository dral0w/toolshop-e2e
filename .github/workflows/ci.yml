name: API tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          TOOLSHOP_EMAIL: ${{ secrets.TOOLSHOP_EMAIL }}
          TOOLSHOP_PASSWORD: ${{ secrets.TOOLSHOP_PASSWORD }}
        run: mvn -B test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

  publish-report:
    name: Publish Allure report
    needs: api-tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Load previous report
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Carry report history over
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
            echo "история предыдущих прогонов перенесена"
          else
            echo "истории нет — это первый отчёт"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
