name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API tests
        env:
          TOOLSHOP_EMAIL: ${{ secrets.TOOLSHOP_EMAIL }}
          TOOLSHOP_PASSWORD: ${{ secrets.TOOLSHOP_PASSWORD }}
        run: mvn -B test -Dgroups=api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 14

  ui-tests:
    name: UI and E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Публичный стенд закрыт Cloudflare и из CI отдаёт проверку «Verify you are human»,
      # поэтому приложение поднимается здесь же
      - name: Start the application
        run: docker compose up -d

      - name: Seed the database
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent && break
            sleep 2
          done
          docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8091/status && exit 0
            sleep 2
          done
          echo "API не поднялся"; docker compose logs laravel-api web; exit 1

      - name: Wait for the UI
        run: |
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200)" = "200" ] && exit 0
            sleep 5
          done
          echo "интерфейс не поднялся"; docker compose logs angular-ui; exit 1

      # Chrome предустановлен на ubuntu-latest, Selenide поднимает его headless
      - name: Run UI and E2E tests
        run: >
          mvn -B test -Dgroups=ui,e2e
          -Dtoolshop.uiBaseUrl=http://localhost:4200
          -Dtoolshop.baseUri=http://localhost:8091

      - name: Application logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui
          path: target/allure-results
          retention-days: 14

  publish-report:
    name: Publish Allure report
    needs: [ api-tests, ui-tests ]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect results of both jobs
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Load previous report
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Carry report history over
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
            echo "история предыдущих прогонов перенесена"
          else
            echo "истории нет — это первый отчёт"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
